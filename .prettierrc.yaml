experimentalTernaries: false
experimentalOperatorPosition: end
printWidth: 100
tabWidth: 2
useTabs: false
semi: false
singleQuote: true
quoteProps: consistent
jsxSingleQuote: false
trailingComma: all
bracketSpacing: true
objectWrap: preserve
bracketSameLine: false
arrowParens: always
rangeStart: 0
rangeEnd: .inf
requirePragma: false
insertPragma: false
checkIgnorePragma: false
proseWrap: always
htmlWhitespaceSensitivity: ignore
vueIndentScriptAndStyle: false
endOfLine: lf
embeddedLanguageFormatting: auto
singleAttributePerLine: true
overrides:
  # The autoconfig script is JavaScript; Firefox only needs the file name it's given
  - files: '*.cfg'
    options:
      parser: babel
