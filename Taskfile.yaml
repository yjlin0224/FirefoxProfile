# Firefox profile customization: edit here, deploy to the profile named in .env.
# Every task that talks to Firefox finds the Browser Toolbox's port by itself; add PORT=1234
# to use a specific one (e.g. `task watch PORT=1234`).
version: '3'

vars:
  # Pinned so formatting doesn't change under you; bump it on purpose
  PRETTIER_VERSION: 3.9.10

tasks:
  default:
    desc: List the tasks
    silent: true
    cmds:
      - task --list

  deploy:
    desc:
      Copy profile/ (chrome/ mirrored, user.js) to the Firefox profile, then reload what changed in
      Firefox
    cmds:
      - node scripts/deploy.mjs {{if .PORT}}--port {{.PORT}}{{end}} {{.CLI_ARGS}}

  watch:
    desc: Deploy and reload on every save in profile/ (keeps running)
    cmds:
      - node scripts/watch.mjs {{if .PORT}}--port {{.PORT}}{{end}}

  diff:
    desc: List what deploy would change in the profile (changes nothing)
    cmds:
      - node scripts/diff.mjs

  reload:
    desc: Reload the deployed userChrome.css and userContent.css in Firefox
    cmds:
      - node scripts/reload.mjs {{if .PORT}}--port {{.PORT}}{{end}}

  port:
    desc: Print the Browser Toolbox's RDP port for the profile
    cmds:
      - node scripts/find-port.mjs {{if .PORT}}--port {{.PORT}}{{end}}

  eval:
    desc:
      'Run a script from scripts/browser/ or an expression in Firefox, e.g. task eval --
      toolbar-ruler.js (options: --tab URL, --pid PID, --raw)'
    cmds:
      - node scripts/rdp-eval.mjs {{if .PORT}}--port {{.PORT}}{{end}} {{.CLI_ARGS}}

  capture:
    desc:
      'Capture the real screen, e.g. task capture -- <cssX> <cssY> <cssW> <cssH> <dpr>
      scripts/out/name.png'
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File scripts/host/capture.ps1 {{.CLI_ARGS}}

  click-test:
    desc:
      Really click across the boundary of two tabs and report which one each click selects (don't
      touch the mouse)
    cmds:
      - node scripts/rdp-eval.mjs {{if .PORT}}--port {{.PORT}}{{end}} click-setup.js
      - python -I scripts/host/click-test.py

  wallpaper:position:
    desc:
      "List the new tab's saved wallpapers, or set one's position (Firefox closed), e.g. task
      wallpaper:position -- right 2 (no number: the applied one)"
    cmds:
      - node scripts/wallpaper-position.mjs {{.CLI_ARGS}}

  wallpaper:open:
    desc:
      Open a saved wallpaper by number in the default image viewer (no number - all of them, in a
      folder)
    cmds:
      - node scripts/wallpaper-open.mjs {{.CLI_ARGS}}

  fmt:
    desc:
      Format the scripts, JSON and YAML with Prettier (.prettierrc.yaml; CSS, user.js and Markdown
      excluded, see .prettierignore)
    cmds:
      - npx --yes prettier@{{.PRETTIER_VERSION}} --write .

  fmt:check:
    desc: Check the formatting without changing anything
    cmds:
      - npx --yes prettier@{{.PRETTIER_VERSION}} --check .

  userjs:check:
    desc:
      'Check user.js: syntax, duplicates, spacing (add -- --fix), and against the running Firefox
      (add -- --offline to skip)'
    cmds:
      - node scripts/userjs-check.mjs {{if .PORT}}--port {{.PORT}}{{end}} {{.CLI_ARGS}}

  check:
    desc: All checks (formatting and user.js), e.g. before a commit
    cmds:
      - task: fmt:check
      - task: userjs:check

  prefs:dump:
    desc:
      Write reference/about-preferences.{defaults,current}.js - about:preferences page by page, each
      setting's prefs with their default and current values (needs the Browser Toolbox)
    cmds:
      - node scripts/about-preferences.mjs {{if .PORT}}--port {{.PORT}}{{end}} {{.CLI_ARGS}}

  mods:update:
    desc:
      Download the third-party mods (scripts/mods.json) at their latest upstream commit into
      profile/chrome/UserChromes/ and record it; mods edited here are skipped unless -- --force
    cmds:
      - node scripts/mods-update.mjs {{.CLI_ARGS}}
