# Firefox profile customization: edit here, deploy to the profile named in .env.
# Every task that talks to Firefox finds the Browser Toolbox's port by itself; add PORT=1234
# to use a specific one (e.g. `task watch PORT=1234`).
version: '3'

tasks:
  default:
    desc: List the tasks
    silent: true
    cmds:
      - task --list

  deploy:
    desc:
      Copy profile/ (chrome/ mirrored, user.js) to the Firefox profile, then reload what changed in
      Firefox
    cmds:
      - node scripts/deploy.mjs {{if .PORT}}--port {{.PORT}}{{end}} {{.CLI_ARGS}}

  watch:
    desc: Deploy and reload on every save in profile/ (keeps running)
    cmds:
      - node scripts/watch.mjs {{if .PORT}}--port {{.PORT}}{{end}}

  diff:
    desc: List what deploy would change in the profile (changes nothing)
    cmds:
      - node scripts/diff.mjs

  reload:
    desc: Reload the deployed userChrome.css and userContent.css in Firefox
    cmds:
      - node scripts/reload.mjs {{if .PORT}}--port {{.PORT}}{{end}}

  port:
    desc: Print the Browser Toolbox's RDP port for the profile
    cmds:
      - node scripts/find-port.mjs {{if .PORT}}--port {{.PORT}}{{end}}

  eval:
    desc:
      'Run a script from scripts/browser/ or an expression in Firefox, e.g. task eval --
      toolbar-ruler.js (options: --tab URL, --pid PID, --raw)'
    cmds:
      - node scripts/rdp-eval.mjs {{if .PORT}}--port {{.PORT}}{{end}} {{.CLI_ARGS}}

  capture:
    desc:
      'Capture the real screen, e.g. task capture -- <cssX> <cssY> <cssW> <cssH> <dpr>
      scripts/out/name.png'
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File scripts/host/capture.ps1 {{.CLI_ARGS}}

  click-test:
    desc:
      Really click across the boundary of two tabs and report which one each click selects (don't
      touch the mouse)
    cmds:
      - node scripts/rdp-eval.mjs {{if .PORT}}--port {{.PORT}}{{end}} click-setup.js
      - python -I scripts/host/click-test.py
