// firefox.cfg (Firefox skips this first line: keep it a comment)
// Firefox's autoconfig script, named by defaults/pref/autoconfig.js. From this repo's install/;
// `task autoconfig:install` copies it next to firefox.exe.
//
// It runs at every startup, before the first window, with chrome privileges and outside any
// sandbox. So it stays self-contained: it reads and runs nothing else. Never make it load a
// file from the profile or the repo: any program running as the user can write those, and
// would get the whole browser (the install folder needs administrator rights). What it does:
//   - The Library and Page Info windows get windowsmica when windows have Mica, so Windows
//     draws the backdrop userChrome.css's "Library Window" and "Page Info Window" rules wait
//     for.
//   - Tabs showing an about: page get the transparent attribute, so Firefox doesn't paint its
//     default background behind the page, and userContent.css's "about: Pages" rules show the
//     window's Mica through it. firefoxprofile.transparent_about_pages = false (about:config)
//     turns this and those rules off at the next startup.
//   - The page's context menu gets Page Info back (Firefox dropped it from there; Ctrl+I and
//     Tools > Page Info still open it), after View Page Source and shown whenever that is.
//   - The tab context menu gets View Page Source and Page Info, for the tab it opened on.
//   - The private window's new tab gets the new tab's uploaded wallpaper (a user sheet made
//     from the new tab's prefs).
//   - Profile backups (Settings > Backup) are made at most once per
//     browser.backup.scheduled.minimum-time-between-backups-seconds: Firefox otherwise makes a
//     new one after any data removal.
;(() => {
  // userContent.css checks it with -moz-pref(). A default value: never written to prefs.js,
  // gone with this file
  defaultPref('firefoxprofile.transparent_about_pages', true)

  const MICA_WINDOWS = [
    'chrome://browser/content/places/places.xhtml',
    'chrome://browser/content/pageinfo/pageInfo.xhtml',
  ]

  // Not about:blank (a tab before its first page, or one a page writes into) or about:srcdoc:
  // they hold anything, with no background of their own
  const isAboutPage = (uri) => uri?.schemeIs('about') && !['blank', 'srcdoc'].includes(uri.filePath)

  // Firefox takes the attribute off at every top-level location change, unless
  // browser.tabs.allow_transparent_browser, before telling the tabs progress listeners: this
  // one puts it back on about: pages.
  // Firefox: Tabbrowser.sys.mjs (TabProgressListener.onLocationChange, _callProgressListeners)
  const tabsListener = {
    onLocationChange(browser, webProgress, request, location) {
      if (webProgress.isTopLevel && isAboutPage(location))
        browser.setAttribute('transparent', 'true')
    },
  }

  // Page Info in the page's context menu: Firefox's own command (as Ctrl+I) and label (the
  // Tools menu's). It follows View Page Source's hidden attribute, which Firefox's context menu
  // code sets for each place the menu opens on (a page, not a link, an image or a selection),
  // whichever of the two runs first.
  // Firefox: browser-context.inc (#context-viewsource), browser-sets.inc (View:PageInfo),
  // browser-menubar.inc (#menu_pageInfo, menu-tools-page-info)
  const addPageInfoItem = (doc) => {
    const source = doc.getElementById('context-viewsource')
    if (!source || doc.getElementById('context-viewinfo')) return
    const item = doc.createXULElement('menuitem')
    item.id = 'context-viewinfo'
    item.setAttribute('command', 'View:PageInfo')
    item.setAttribute('data-l10n-id', 'menu-tools-page-info')
    item.hidden = source.hidden
    source.after(item)
    new doc.defaultView.MutationObserver(() => (item.hidden = source.hidden)).observe(source, {
      attributes: true,
      attributeFilter: ['hidden'],
    })
  }

  // View Page Source and Page Info in the tab context menu, for the tab it opened on, in a
  // group of their own under Select All Tabs (above Send Tab to Device). Hidden while several
  // tabs are selected, as Firefox's own one-tab items; disabled for a tab that isn't loaded.
  // Firefox's labels (the page context menu's and the Tools menu's) and functions.
  // Added each time the menu opens, after Firefox has arranged it (its listener on the menu
  // runs before this one on the window) and set TabContextMenu.contextTab, and removed when it
  // closes: Firefox arranges the menu again if browser.tabs.contextmenu.altstructure.enabled
  // changes, and that throws on items it doesn't know.
  // Firefox: tab-context-menu.js (updateContextMenu, _ensureMenuArranged, MenuSectionLayout),
  // main-popupset.js, browser-commands.js (BrowserCommands.viewSource, pageInfo)
  const addTabItems = (win) => {
    const doc = win.document
    const make = (id, l10nId, run) => {
      const item = doc.createXULElement('menuitem')
      item.id = id
      item.setAttribute('data-l10n-id', l10nId)
      item.addEventListener('command', () => run(win.TabContextMenu.contextTab.linkedBrowser))
      return item
    }
    const items = [
      make('context_viewTabSource', 'main-context-menu-view-page-source', (browser) =>
        win.BrowserCommands.viewSource(browser),
      ),
      make('context_viewTabInfo', 'menu-tools-page-info', (browser) =>
        win.BrowserCommands.pageInfo(
          browser.currentURI.spec,
          null,
          null,
          browser.browsingContext,
          browser,
        ),
      ),
      doc.createXULElement('menuseparator'),
    ]
    items[2].id = 'context_viewTabSeparator'
    win.addEventListener('popupshowing', (event) => {
      if (event.target.id !== 'tabContextMenu') return
      const tab = win.TabContextMenu.contextTab
      const loaded = !!tab.linkedPanel && !tab.hasAttribute('pending')
      for (const item of items) item.hidden = win.TabContextMenu.multiselected
      items[0].disabled = items[1].disabled = !loaded
      doc.getElementById('context_tabToolsSeparator')?.after(...items)
    })
    win.addEventListener('popuphidden', (event) => {
      if (event.target.id === 'tabContextMenu') for (const item of items) item.remove()
    })
  }

  // The private window's new tab gets the new tab's wallpaper, when that's an uploaded one (the
  // applied file in the library, named by a pref): a user sheet made from the prefs, made again
  // when they change. Its text as the new tab's titles (userContent.css): Firefox's
  // color-scheme for the wallpaper's theme, the letters in the page color instead of the
  // page's fixed white (on .info-border for the info text, whose color is currentColor at
  // 69%), outlined in the text color (the link in its own color) and glowing in it. Only for the transparent about: pages
  // (userContent.css's condition), as the rest of that page's rules.
  // The file name comes from a pref anyone running as the user can change, so it's used only
  // when it's exactly a library file's name (no quotes or parentheses can reach the CSS).
  // Firefox: newtab's Wallpapers/WallpaperFileNames.mjs (the name, the position tokens),
  // activity-stream.css (`.lightWallpaper … { color-scheme: light }`), aboutPrivateBrowsing.css
  // (`html.private { color: var(--color-white) }`, `.info { color: var(--text-color-deemphasized) }`,
  // that being color-mix(in srgb, currentColor 69%, transparent))
  const WALLPAPER_CHOICE = 'browser.newtabpage.activity-stream.newtabWallpapers.wallpaper'
  const WALLPAPER_FILE = 'browser.newtabpage.activity-stream.newtabWallpapers.customWallpaper.uuid'
  const WALLPAPER_NAME =
    /^v1-[a-z]+-(light|dark)-(center|top|bottom|left|right|topleft|topright|bottomleft|bottomright)-[1-9][0-9]*-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/
  const POSITIONS = {
    topleft: 'top left',
    topright: 'top right',
    bottomleft: 'bottom left',
    bottomright: 'bottom right',
  }
  let wallpaperSheet = null
  const updatePrivateWallpaper = () => {
    const sss = Components.classes['@mozilla.org/content/style-sheet-service;1'].getService(
      Components.interfaces.nsIStyleSheetService,
    )
    if (wallpaperSheet && sss.sheetRegistered(wallpaperSheet, sss.USER_SHEET))
      sss.unregisterSheet(wallpaperSheet, sss.USER_SHEET)
    wallpaperSheet = null
    const file = Services.prefs.getStringPref(WALLPAPER_FILE, '')
    const match =
      Services.prefs.getStringPref(WALLPAPER_CHOICE, '') === 'custom' && file.match(WALLPAPER_NAME)
    if (!match) return
    const [, theme, position] = match
    const css = `
      @media -moz-pref("browser.tabs.allow_transparent_browser"), -moz-pref("firefoxprofile.transparent_about_pages") {
        @-moz-document url-prefix("about:privatebrowsing") {
          body {
            background: url("moz-newtab-wallpaper://library/${file}") ${POSITIONS[position] ?? position} / cover no-repeat !important;
          }
          .nova-tagline, .nova-subheader, .info-border, #private-browsing-myths {
            color-scheme: ${theme} !important;
            color: var(--background-color-canvas) !important;
          }
          .nova-tagline, .nova-subheader, .info p {
            -webkit-text-stroke: 2px var(--text-color) !important;
          }
          #private-browsing-myths {
            -webkit-text-stroke: 2px var(--link-color) !important;
          }
          .nova-tagline, .nova-subheader, .info p, #private-browsing-myths {
            paint-order: stroke fill !important;
            text-shadow:
              0 0 3px color-mix(in srgb, var(--text-color) 90%, transparent),
              0 0 6px color-mix(in srgb, var(--text-color) 50%, transparent) !important;
          }
        }
      }`
    wallpaperSheet = Services.io.newURI('data:text/css,' + encodeURIComponent(css))
    sss.loadAndRegisterSheet(wallpaperSheet, sss.USER_SHEET)
  }
  let wallpaperWatched = false
  const watchPrivateWallpaper = () => {
    if (wallpaperWatched) return
    wallpaperWatched = true
    updatePrivateWallpaper()
    Services.prefs.addObserver(WALLPAPER_CHOICE, updatePrivateWallpaper)
    Services.prefs.addObserver(WALLPAPER_FILE, updatePrivateWallpaper)
  }

  // Firefox makes a new profile backup 10 s after any data removal (a cookie cleared from the
  // browser or by an extension, history or a bookmark deleted, a site permission or saved
  // login removed…), not waiting for
  // browser.backup.scheduled.minimum-time-between-backups-seconds as the scheduled backup
  // does, so a full backup can be written many times a day. Those are skipped while the last
  // backup is newer than that interval; the scheduled backup and Backup now still run, and the
  // next scheduled one picks up the removal. The method is replaced on the prototype: the
  // debouncer calls it through `this`, so the instance made before the first window gets it too.
  // Patched once, from the first browser window (well before the 10 s at startup).
  // Firefox: BackupService.sys.mjs (#regenerationDebouncer, createBackupOnIdleDispatch, onIdle);
  // bug 2084241, bug 2084310
  let backupsLimited = false
  const limitBackups = () => {
    if (backupsLimited) return
    backupsLimited = true
    const { BackupService } = ChromeUtils.importESModule(
      'moz-src:///browser/components/backup/BackupService.sys.mjs',
    )
    const createBackupOnIdleDispatch = BackupService.prototype.createBackupOnIdleDispatch
    BackupService.prototype.createBackupOnIdleDispatch = function (options = {}) {
      if (options.reason === 'user deleted some data') {
        const last = Services.prefs.getIntPref('browser.backup.scheduled.last-backup-timestamp', 0)
        const interval = Services.prefs.getIntPref(
          'browser.backup.scheduled.minimum-time-between-backups-seconds',
          86400,
        )
        if (Date.now() / 1000 - last < interval) return Promise.resolve()
      }
      return createBackupOnIdleDispatch.call(this, options)
    }
  }

  // A browser window, once gBrowser exists and before its tabs are restored.
  // Firefox: browser-init.js (gBrowserInit.onLoad)
  Services.obs.addObserver((win) => {
    limitBackups()
    watchPrivateWallpaper()
    addPageInfoItem(win.document)
    addTabItems(win)
    if (!Services.prefs.getBoolPref('firefoxprofile.transparent_about_pages', false)) return
    win.gBrowser.addTabsProgressListener(tabsListener)
    // Its first tab may have loaded already
    for (const browser of win.gBrowser.browsers)
      if (isAboutPage(browser.currentURI)) browser.setAttribute('transparent', 'true')
  }, 'browser-window-before-show')

  // Windows read windowsmica when a window opens and when it changes (AppWindow.cpp,
  // ChromeObserver.cpp); added once the document is there (measured: the backdrop shows).
  // The browser window has it in its markup (browser.xhtml).
  Services.ww.registerNotification((win, topic) => {
    if (topic !== 'domwindowopened') return
    win.addEventListener(
      'DOMContentLoaded',
      () => {
        if (
          MICA_WINDOWS.includes(win.location.href) &&
          win.matchMedia('(-moz-windows-mica)').matches
        )
          win.document.documentElement.setAttribute('windowsmica', 'true')
      },
      { once: true },
    )
  })
})()
