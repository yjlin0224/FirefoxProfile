// firefoxprofile.cfg (Firefox skips this first line: keep it a comment)
// Firefox's autoconfig script, named by defaults/pref/autoconfig.js. From this repo's install/;
// `task autoconfig:install` copies it next to firefox.exe.
//
// It runs at every startup, before the first window, with chrome privileges and outside any
// sandbox. So it stays self-contained: it reads and runs nothing else. Never make it load a
// file from the profile or the repo: any program running as the user can write those, and
// would get the whole browser (the install folder needs administrator rights). What it does:
//   - The Library and Page Info windows get windowsmica when windows have Mica, so Windows
//     draws the backdrop userChrome.css's "Library Window" and "Page Info Window" rules wait
//     for.
//   - Tabs showing an about: page get the transparent attribute, so Firefox doesn't paint its
//     default background behind the page, and userContent.css's "about: Pages" rules show the
//     window's Mica through it. firefoxprofile.transparent_about_pages = false (about:config)
//     turns this and those rules off at the next startup.
//   - The page's context menu gets Page Info back (Firefox dropped it from there; Ctrl+I and
//     Tools > Page Info still open it), after View Page Source and shown whenever that is.
(() => {
  // userContent.css checks it with -moz-pref(). A default value: never written to prefs.js,
  // gone with this file
  defaultPref('firefoxprofile.transparent_about_pages', true)

  const MICA_WINDOWS = [
    'chrome://browser/content/places/places.xhtml',
    'chrome://browser/content/pageinfo/pageInfo.xhtml',
  ]

  // Not about:blank (a tab before its first page, or one a page writes into) or about:srcdoc:
  // they hold anything, with no background of their own
  const isAboutPage = (uri) =>
    uri?.schemeIs('about') && !['blank', 'srcdoc'].includes(uri.filePath)

  // Firefox takes the attribute off at every top-level location change, unless
  // browser.tabs.allow_transparent_browser, before telling the tabs progress listeners: this
  // one puts it back on about: pages.
  // Firefox: Tabbrowser.sys.mjs (TabProgressListener.onLocationChange, _callProgressListeners)
  const tabsListener = {
    onLocationChange(browser, webProgress, request, location) {
      if (webProgress.isTopLevel && isAboutPage(location))
        browser.setAttribute('transparent', 'true')
    },
  }

  // Page Info in the page's context menu: Firefox's own command (as Ctrl+I) and label (the
  // Tools menu's). It follows View Page Source's hidden attribute, which Firefox's context menu
  // code sets for each place the menu opens on (a page, not a link, an image or a selection),
  // whichever of the two runs first.
  // Firefox: browser-context.inc (#context-viewsource), browser-sets.inc (View:PageInfo),
  // browser-menubar.inc (#menu_pageInfo, menu-tools-page-info)
  const addPageInfoItem = (doc) => {
    const source = doc.getElementById('context-viewsource')
    if (!source || doc.getElementById('context-viewinfo')) return
    const item = doc.createXULElement('menuitem')
    item.id = 'context-viewinfo'
    item.setAttribute('command', 'View:PageInfo')
    item.setAttribute('data-l10n-id', 'menu-tools-page-info')
    item.hidden = source.hidden
    source.after(item)
    new doc.defaultView.MutationObserver(() => (item.hidden = source.hidden)).observe(source, {
      attributes: true,
      attributeFilter: ['hidden'],
    })
  }

  // A browser window, once gBrowser exists and before its tabs are restored.
  // Firefox: browser-init.js (gBrowserInit.onLoad)
  Services.obs.addObserver((win) => {
    addPageInfoItem(win.document)
    if (!Services.prefs.getBoolPref('firefoxprofile.transparent_about_pages', false)) return
    win.gBrowser.addTabsProgressListener(tabsListener)
    // Its first tab may have loaded already
    for (const browser of win.gBrowser.browsers)
      if (isAboutPage(browser.currentURI)) browser.setAttribute('transparent', 'true')
  }, 'browser-window-before-show')

  // Windows read windowsmica when a window opens and when it changes (AppWindow.cpp,
  // ChromeObserver.cpp); added once the document is there (measured: the backdrop shows).
  // The browser window has it in its markup (browser.xhtml).
  Services.ww.registerNotification((win, topic) => {
    if (topic !== 'domwindowopened') return
    win.addEventListener(
      'DOMContentLoaded',
      () => {
        if (
          MICA_WINDOWS.includes(win.location.href) &&
          win.matchMedia('(-moz-windows-mica)').matches
        )
          win.document.documentElement.setAttribute('windowsmica', 'true')
      },
      { once: true },
    )
  })
})()
